LAB_DESCRIPTION="IOAM GOB: n1 to n5 on their own GOB UML kernel, h1 and h2 are containers"
LAB_AUTHOR="Andrea Mayer"
LAB_EMAIL="andrea.mayer@uniroma2.it"

h1[0]="A"
n1[0]="A"
n1[1]="B"
n2[0]="B"
n2[1]="C"
n3[0]="C"
n3[1]="D"
n4[0]="D"
n4[1]="E"
n5[0]="E"
n5[1]="F"
h2[0]="F"

h1[ipv6]="true"
h2[ipv6]="true"

# The GOB nodes: the GOB UML kernel and the image kathara-uml/gob, with the
# iproute2, the bpftool and the clang that GOB needs, both built by
# ../build.sh. kernel is a link to ../out/kernel, where build.sh puts the
# kernel.
n1[kernel]="kernel/linux"
n1[image]="kathara-uml/gob"
n1[ipv6]="true"
n2[kernel]="kernel/linux"
n2[image]="kathara-uml/gob"
n2[ipv6]="true"
n3[kernel]="kernel/linux"
n3[image]="kathara-uml/gob"
n3[ipv6]="true"
n4[kernel]="kernel/linux"
n4[image]="kathara-uml/gob"
n4[ipv6]="true"
n5[kernel]="kernel/linux"
n5[image]="kathara-uml/gob"
n5[ipv6]="true"
