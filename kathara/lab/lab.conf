LAB_DESCRIPTION="IOAM GOB: n1 to n5 on their own GOB UML kernel, h1 and h2 are containers"
LAB_AUTHOR="Andrea Mayer"
LAB_EMAIL="andrea.mayer@uniroma2.it"

h1[0]="A"
n1[0]="A"
n1[1]="B"
n2[0]="B"
n2[1]="C"
n3[0]="C"
n3[1]="D"
n4[0]="D"
n4[1]="E"
n5[0]="E"
n5[1]="F"
h2[0]="F"

h1[ipv6]="true"
h2[ipv6]="true"

# The GOB nodes: their image carries the GOB UML kernel, which Kathara
# runs them on, and the iproute2, the bpftool and the clang that GOB
# needs. ../build.sh builds it and checks that this file names it.
# A node can run on another UML kernel with the kernel option, for example
# n3 on the kernel that ../build.sh kernel builds:
#n3[kernel]="../out/kernel/linux"
n1[image]="ghcr.io/netgroup/kathara-uml-gob:6.18.0-rc1-494d8b67e580"
n1[ipv6]="true"
n2[image]="ghcr.io/netgroup/kathara-uml-gob:6.18.0-rc1-494d8b67e580"
n2[ipv6]="true"
n3[image]="ghcr.io/netgroup/kathara-uml-gob:6.18.0-rc1-494d8b67e580"
n3[ipv6]="true"
n4[image]="ghcr.io/netgroup/kathara-uml-gob:6.18.0-rc1-494d8b67e580"
n4[ipv6]="true"
n5[image]="ghcr.io/netgroup/kathara-uml-gob:6.18.0-rc1-494d8b67e580"
n5[ipv6]="true"
